<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bilspotter</title>

  <!-- 📱 PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />

  <!-- 🚗 App icon -->
  <link rel="icon" type="image/png" href="b98ab4e3-b4bf-417e-a76a-b7bb691b1da5.png" />

  <!-- 🎨 CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <h1>🚗 Bilspotter</h1>

    <!-- ➕ INPUT -->
    <div class="top-bar">

      <input
        type="text"
        id="plateInput"
        placeholder="Skriv registreringsnummer..."
        maxlength="10"
        autocapitalize="characters"
        autocomplete="off"
        spellcheck="false"
      />

      <button id="addBtn">Legg til</button>

    </div>

    <!-- 📊 STATS -->
    <div id="stats"></div>

    <!-- 🚗 LAST CAR -->
    <div id="lastCar" class="last-card"></div>

    <!-- ⭐ XP -->
    <div class="xp-card">

      <div class="xp-top">

        <div>
          <div class="level-label">LEVEL</div>
          <div id="level">1</div>
        </div>

        <div id="xpText" class="xp-info">0 / 100 XP</div>

      </div>

      <div class="xp-bar">
        <div id="xpFill" class="xp-fill"></div>
      </div>

    </div>

    <!-- 🎮 QUESTS -->
    <div class="game-ui">

     <div class="quest-container">

<div id="activeQuest" class="active-quest-card"></div>
      
      <div class="quests-title">
        <span>📅 Daily Quests</span>
        <span id="dailyReset" class="quest-reset">--</span>
      </div>

      <div id="dailyQuests"></div>

      <div class="quests-title weekly-title">
        <span>🗓️ Weekly Quests</span>
        <span id="weeklyReset" class="quest-reset">--</span>
      </div>

      <div id="weeklyQuests"></div>

    </div>

    <!-- 🚗 LIST HEADER -->
    <div class="list-header">

      <div class="list-title">🚗 Spotted cars</div>

      <div class="controls">

        <input
          type="text"
          id="searchInput"
          placeholder="Søk..."
        />

        <select id="sortSelect">
          <option value="newest">Nyeste først</option>
          <option value="oldest">Eldste først</option>
          <option value="az">A → Å</option>
          <option value="za">Å → A</option>
          <option value="num">Nummer ↑</option>
          <option value="numDesc">Nummer ↓</option>
          <option value="favorite">⭐ Favoritter først</option>
        </select>

      </div>

    </div>

    <!-- 🚗 LIST -->
    <div class="list-card">
      <div id="list"></div>
    </div>

  </div>

  <!-- ⚡ JS -->
  <script type="module" src="script.js"></script>

    <div id="questPopup" class="quest-popup hidden"></div>
</body>
</html>
